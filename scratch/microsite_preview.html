<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SparkStation Microsite | Industrial Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --primary: #3b82f6;
            --accent: #60a5fa;
            --text: #f9fafb;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* THE INDUSTRIAL TEXTURES (RECOVERED) */
        .industrial-noise {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 1;
        }

        .tactical-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .gradient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* MICROSITE ENGINE CONTAINER */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* PROFILE SECTION */
        .profile {
            text-align: center;
            margin-bottom: 3rem;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            margin: 0 auto 1.5rem;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .avatar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent, rgba(255,255,255,0.1));
        }

        .title {
            font-size: 2.25rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .bio {
            font-family: 'JetBrains Mono', monospace;
            color: #94a3b8;
            font-size: 0.875rem;
            max-width: 280px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* SOCIAL LINK ENGINE (THE "CONNECT" GRID) */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }

        .social-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        .social-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .social-icon {
            width: 32px;
            height: 32px;
            color: var(--primary);
        }

        .social-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
        }

        /* STAGGERED ANIMATION SIMULATION */
        .social-card:nth-child(1) { animation: slideIn 0.5s 0.2s backwards; }
        .social-card:nth-child(2) { animation: slideIn 0.5s 0.3s backwards; }
        .social-card:nth-child(3) { animation: slideIn 0.5s 0.4s backwards; }
        .social-card:nth-child(4) { animation: slideIn 0.5s 0.5s backwards; }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* BOTTOM HUD */
        .hud {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--primary);
            padding: 0.5rem 1.5rem;
            border-radius: 999px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--primary);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>
    <div class="industrial-noise"></div>
    <div class="tactical-grid"></div>
    <div class="gradient-glow"></div>

            <a href="#" class="social-card">

                <span class="social-label">GITHUB</span>
            </a>
            <a href="#" class="social-card">
                <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.761 0 5-2.239 5-5v-14c0-2.761-2.239-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                <span class="social-label">LINKEDIN</span>
            </a>
        </div>
    </div>

    <div class="hud">PREVIEW MODE // TACTICAL RECOVERY</div>
</body>
</html>
